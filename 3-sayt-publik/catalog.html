<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahsulotlar Katalogi — Asosiy Do'kon</title>
  <link rel="stylesheet" href="css/storefront.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span>⚡ Asosiy Do'kon</span>
      </a>

      <div class="nav-links">
        <a href="index.html" class="nav-link">Bosh sahifa</a>
        <a href="catalog.html" class="nav-link active">Katalog</a>
        <a href="cart.html" class="cart-btn">
          <span>🛒 Savat</span>
          <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 40px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="font-size: 1.8rem; font-weight: 800;">Barcha Mahsulotlar</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Do'konimizda mavjud barcha tovarlar va ularning batafsil narxlari</p>
      </div>

      <div class="search-wrapper" style="margin: 0; min-width: 280px;">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Tezkor qidirish...">
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="category-filter" style="justify-content: flex-start; margin: 0 0 30px;">
      <button class="category-pill active" data-category="all">Barchasi</button>
      <button class="category-pill" data-category="Smartfonlar">Smartfonlar</button>
      <button class="category-pill" data-category="Noutbuklar">Noutbuklar</button>
      <button class="category-pill" data-category="O'yin pristavkalari">O'yin Pristavkalari</button>
      <button class="category-pill" data-category="Aqlli soatlar">Aqlli Soatlar</button>
      <button class="category-pill" data-category="Aksessuarlar">Aksessuarlar</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 Asosiy Do'kon. Rasmiy Onlayn Savdo Portali.</p>
    </div>
  </footer>

  <script type="module" src="js/storefront.js"></script>
</body>
</html>
