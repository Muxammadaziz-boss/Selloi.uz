# Nginx Production Reverse Proxy Configuration
# Faylni /etc/nginx/sites-available/your-domain.conf sifatida saqlang

# 1. HTTP -> HTTPS yo'naltirish
server {
    listen 80;
    server_name your-domain.uz api.your-domain.uz shop.your-domain.uz;
    return 301 https://$host$request_uri;
}

# 2. Asosiy Admin Dashboard (Next.js - Port 3000)
server {
    listen 443 ssl http2;
    server_name your-domain.uz;

    ssl_certificate /etc/letsencrypt/live/your-domain.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.uz/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Backend API va Telegram Webhook (FastAPI - Port 8000)
server {
    listen 443 ssl http2;
    server_name api.your-domain.uz;

    ssl_certificate /etc/letsencrypt/live/your-domain.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.uz/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statik fayllar va rasmlar keshlanishi
    location /storage/ {
        proxy_pass http://127.0.0.1:8000/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 4. Public Veb-Do'kon va Telegram WebApp (Port 8000/shop yoki statik)
server {
    listen 443 ssl http2;
    server_name shop.your-domain.uz;

    ssl_certificate /etc/letsencrypt/live/your-domain.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.uz/privkey.pem;

    root /var/www/telegram-ai-agent/3-sayt-publik;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API so'rovlarni backendga yo'naltirish
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
