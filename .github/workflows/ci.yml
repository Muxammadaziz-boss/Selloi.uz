name: CI Release Gate

on:
  push:
    branches: [ "frontend/linear-redesign", "main" ]
  pull_request:
    branches: [ "frontend/linear-redesign", "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: Backend Pytest & Financial Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Dedicated CI Test Environment
        run: |
          CI_JWT_SECRET=$(openssl rand -hex 32)
          CI_ADMIN_TOKEN=$(openssl rand -hex 32)
          CI_ENC_KEY=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          CI_TG_SECRET=$(openssl rand -hex 24)
          CI_TG_BOT_TOKEN="123456789:AA$(openssl rand -hex 16)"

          echo "APP_ENV=test" >> $GITHUB_ENV
          echo "TESTING=true" >> $GITHUB_ENV
          echo "JWT_SECRET=${CI_JWT_SECRET}" >> $GITHUB_ENV
          echo "ADMIN_API_TOKEN=${CI_ADMIN_TOKEN}" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=${CI_ENC_KEY}" >> $GITHUB_ENV
          echo "TELEGRAM_WEBHOOK_SECRET=${CI_TG_SECRET}" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${CI_TG_BOT_TOKEN}" >> $GITHUB_ENV
          echo "ADMIN_TELEGRAM_ID=999888777" >> $GITHUB_ENV
          echo "PUBLIC_WEBHOOK_URL=https://selloi.uz" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/test_ci_db" >> $GITHUB_ENV

      - name: Validate Required CI Credentials
        run: |
          for var in JWT_SECRET ADMIN_API_TOKEN ENCRYPTION_KEY TELEGRAM_WEBHOOK_SECRET TELEGRAM_BOT_TOKEN ADMIN_TELEGRAM_ID PUBLIC_WEBHOOK_URL DATABASE_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::CI environment variable $var is missing or empty."
              exit 1
            fi
          done
          echo "All required CI backend credentials successfully validated."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install anyio httpx asyncpg aiosqlite

      - name: Run Backend Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Run Financial Precision & Formula Trace
        run: |
          python scripts/financial_formula_trace.py

      - name: Upload Financial Trace Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-trace-results
          path: financial_trace_results.json
          if-no-files-found: ignore

  frontend-build:
    name: Frontend TypeScript, Entitlements & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Design Entitlement & Authorization Matrix Suite
        run: node --experimental-strip-types tests/design_entitlement_suite.mjs

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e-and-accessibility:
    name: Playwright E2E, Responsive, Entitlement & Axe-Core Suites
    needs: [backend-audit, frontend-build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Dedicated CI Test Environment
        run: |
          CI_JWT_SECRET=$(openssl rand -hex 32)
          CI_SESSION_SECRET=$(openssl rand -hex 32)
          CI_ADMIN_TOKEN=$(openssl rand -hex 32)
          CI_ENC_KEY=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          CI_TG_SECRET=$(openssl rand -hex 24)
          CI_DASHBOARD_PWD=$(openssl rand -base64 24)
          CI_TG_BOT_TOKEN="123456789:AA$(openssl rand -hex 16)"

          echo "APP_ENV=test" >> $GITHUB_ENV
          echo "TESTING=true" >> $GITHUB_ENV
          echo "JWT_SECRET=${CI_JWT_SECRET}" >> $GITHUB_ENV
          echo "SESSION_SECRET=${CI_SESSION_SECRET}" >> $GITHUB_ENV
          echo "ADMIN_API_TOKEN=${CI_ADMIN_TOKEN}" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=${CI_ENC_KEY}" >> $GITHUB_ENV
          echo "TELEGRAM_WEBHOOK_SECRET=${CI_TG_SECRET}" >> $GITHUB_ENV
          echo "DASHBOARD_PASSWORD=${CI_DASHBOARD_PWD}" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${CI_TG_BOT_TOKEN}" >> $GITHUB_ENV
          echo "ADMIN_TELEGRAM_ID=999888777" >> $GITHUB_ENV
          echo "PUBLIC_WEBHOOK_URL=https://selloi.uz" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/test_ci_db" >> $GITHUB_ENV
          echo "BACKEND_URL=http://127.0.0.1:8000" >> $GITHUB_ENV
          echo "TEST_DASHBOARD_PASSWORD=${CI_DASHBOARD_PWD}" >> $GITHUB_ENV

      - name: Validate Required CI Credentials
        run: |
          for var in JWT_SECRET SESSION_SECRET ADMIN_API_TOKEN ENCRYPTION_KEY TELEGRAM_WEBHOOK_SECRET DASHBOARD_PASSWORD TELEGRAM_BOT_TOKEN ADMIN_TELEGRAM_ID PUBLIC_WEBHOOK_URL DATABASE_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::CI environment variable $var is missing or empty."
              exit 1
            fi
          done
          echo "All required CI E2E credentials successfully validated."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install uvicorn asyncpg anyio pytest httpx

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Browsers with dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -s -f -o /dev/null http://127.0.0.1:8000/docs || exit 1

      - name: Seed E2E Playwright Test Fixtures
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import select, text
          from app.core.db import SessionLocal
          from app.models import Organization, OrganizationMember, Plan, Subscription, User

          async def seed():
              async with SessionLocal() as db:
                  users_spec = [
                      (1, "owner@selloi.uz", "Selloi Platform Owner", 777001, True, True, True),
                      (42, "tenant_admin@shop.uz", "Tenant Owner", 777042, True, False, False),
                      (101, "store@selloi.uz", "TechHub Store Owner", 777101, True, False, False),
                      (199, "partial@selloi.uz", "Partial User", None, True, False, False),
                  ]
                  for uid, email, name, tg_id, ev, is_owner, is_admin in users_spec:
                      u = await db.get(User, uid)
                      if not u:
                          db.add(User(
                              id=uid,
                              email=email,
                              full_name=name,
                              hashed_password="",
                              telegram_user_id=tg_id,
                              email_verified=ev,
                              is_platform_owner=is_owner,
                              is_platform_admin=is_admin,
                              is_active=True,
                              token_version=1,
                          ))
                      else:
                          u.email = email
                          u.email_verified = ev
                          u.telegram_user_id = tg_id
                          u.is_platform_owner = is_owner
                          u.is_platform_admin = is_admin
                          u.is_active = True
                          u.token_version = 1

                  orgs_spec = [
                      (1, "Selloi Central", "selloi-central"),
                      (2, "Demo Tenant Two", "demo-tenant-two"),
                      (101, "TechHub Toshkent", "techhub-toshkent"),
                      (102, "Starter Store 102", "starter-store-102"),
                  ]
                  for oid, oname, oslug in orgs_spec:
                      org = await db.get(Organization, oid)
                      if not org:
                          db.add(Organization(id=oid, name=oname, slug=oslug, category="Elektronika", status="active"))
                      elif oid == 101:
                          org.slug = oslug
                          org.name = oname

                  await db.flush()
                  plan = (await db.execute(select(Plan).where(Plan.code == "pro"))).scalar_one_or_none()
                  for oid in (1, 2, 101, 102):
                      if plan:
                          sub = (await db.execute(select(Subscription).where(Subscription.organization_id == oid))).scalar_one_or_none()
                          if not sub:
                              db.add(Subscription(organization_id=oid, plan_id=plan.id, status="active", billing_cycle="monthly"))
                      for uid in (42, 101):
                          mem = (await db.execute(
                              select(OrganizationMember).where(
                                  OrganizationMember.organization_id == oid,
                                  OrganizationMember.user_id == uid,
                              )
                          )).scalar_one_or_none()
                          if not mem:
                              db.add(OrganizationMember(organization_id=oid, user_id=uid, role="owner", is_active=True))

                  await db.commit()
                  for tbl in ("users", "organizations", "organization_members", "subscriptions"):
                      await db.execute(text(f"SELECT setval(pg_get_serial_sequence('{tbl}', 'id'), COALESCE((SELECT MAX(id) FROM {tbl}), 0) + 1, false)"))
                  await db.commit()

          asyncio.run(seed())
          PY

      - name: Start Next.js Server
        working-directory: web
        run: |
          npm run build
          npm run start -- -p 3000 &
          sleep 6
          curl -s -f -o /dev/null http://127.0.0.1:3000/ || exit 1

      - name: Run Entitlement Integration Suite (Auth, Downgrades, UI Logout)
        run: TEST_BASE_URL=http://127.0.0.1:3000 node web/tests/entitlement_integration_suite.mjs

      - name: Reset E2E Token Versions After Logout Test
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import update
          from app.core.db import SessionLocal
          from app.models import User

          async def reset_tokens():
              async with SessionLocal() as db:
                  await db.execute(update(User).values(token_version=1))
                  await db.commit()

          asyncio.run(reset_tokens())
          PY

      - name: Run Selloi Regression E2E, Responsive & Axe-Core WCAG Suite
        run: TEST_BASE_URL=http://127.0.0.1:3000 node web/tests/selloi_regression_e2e.mjs

      - name: Upload Test Results & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-and-a11y-test-evidence
          path: |
            web/tests/entitlement_integration_results.json
            web/tests/screenshots/**/*.png
          if-no-files-found: ignore
